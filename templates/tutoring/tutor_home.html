{% extends "base.html" %}
{% block title %}My students · Tutor Session Reporting{% endblock %}
{% block content %}
  <h1>My students</h1>
  <p class="muted"><a href="mailto:{{ staff_email }}?subject=From tutor {{ user.get_full_name|urlencode }}">Contact LVAEP staff</a></p>

  <form class="filters"
        hx-get="{% url 'tutor_grid' %}"
        hx-target="#student-grid"
        hx-trigger="input changed delay:300ms from:[name=q], change from:[name=sort], change from:[name=from], change from:[name=to], refreshGrid from:body">
    <input type="search" name="q" placeholder="Search students…" value="{{ filters.q }}" autocomplete="off">
    <select name="sort">
      <option value="alpha" {% if filters.sort == "alpha" %}selected{% endif %}>A → Z</option>
      <option value="recent" {% if filters.sort == "recent" %}selected{% endif %}>Most recent session</option>
    </select>
    <label>Met between <input type="date" name="from" value="{{ filters.from }}"></label>
    <label>and <input type="date" name="to" value="{{ filters.to }}"></label>
  </form>

  <div id="student-grid">
    {% include "tutoring/partials/student_grid.html" %}
  </div>
{% endblock %}
