<header class="modal-header">
  <div>
    <strong>{{ a.student.get_full_name }}</strong> · {{ a.subject }}
    {% if not a.is_active %}<span class="badge">Ended {{ a.ended_on|date:"M j, Y" }}</span>{% endif %}
  </div>
  <button type="button" class="link" onclick="modal.close()" aria-label="Close">✕</button>
</header>
